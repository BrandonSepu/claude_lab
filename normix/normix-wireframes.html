<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>normix — wireframe explorations</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;500;600;700&family=Kalam:wght@300;400;700&family=Architects+Daughter&display=swap" rel="stylesheet" />
<style>
  :root {
    --paper: #fbf8f1;
    --ink: #1a1a1a;
    --ink-soft: #4a4a4a;
    --ink-muted: #888;
    --rule: #2a2a2a;
    --teal: #2ec4b6;
    --teal-soft: #cbf3f0;
    --orange: #ff9f1c;
    --orange-soft: #ffbf69;
    --red: #d7263d;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: "Kalam", "Architects Daughter", system-ui, sans-serif;
    min-height: 100vh;
    /* paper grid */
    background-image:
      radial-gradient(rgba(0,0,0,0.04) 1px, transparent 1px),
      linear-gradient(180deg, #fbf8f1, #f6f1e4);
    background-size: 24px 24px, 100% 100%;
  }
  #root { min-height: 100vh; }

  /* sketchy primitives */
  .scribble-border {
    border: 2px solid var(--rule);
    border-radius: 14px 18px 12px 22px / 16px 12px 20px 14px;
    background: #fff;
    box-shadow: 2px 3px 0 0 rgba(0,0,0,0.08);
  }
  .scribble-border.tight {
    border-radius: 8px 12px 6px 14px / 10px 8px 14px 9px;
  }

  .ink-btn {
    font-family: inherit;
    background: #fff;
    color: var(--ink);
    border: 2px solid var(--rule);
    border-radius: 10px 14px 8px 16px / 12px 9px 14px 11px;
    padding: 8px 16px;
    cursor: pointer;
    font-size: 18px;
    box-shadow: 2px 2px 0 0 rgba(0,0,0,0.12);
    transition: transform .08s ease, box-shadow .08s ease;
  }
  .ink-btn:hover { transform: translate(-1px, -1px); box-shadow: 3px 3px 0 0 rgba(0,0,0,0.14); }
  .ink-btn:active { transform: translate(1px, 1px); box-shadow: 1px 1px 0 0 rgba(0,0,0,0.10); }
  .ink-btn[aria-pressed="true"] {
    background: var(--ink);
    color: #fff;
  }

  .accent-fill { background: var(--orange); color: var(--ink); }
  .accent-soft { background: var(--orange-soft); }
  .teal-soft   { background: var(--teal-soft); }
  .teal-fill   { background: var(--teal); color: #fff; }

  /* hand-scrawled headings */
  h1, h2, h3, .scrawl {
    font-family: "Caveat", "Kalam", cursive;
    font-weight: 600;
    letter-spacing: 0.5px;
  }

  /* placeholder rule lines */
  .rule {
    height: 2px;
    background: repeating-linear-gradient(90deg, #2a2a2a 0 8px, transparent 8px 14px);
    border-radius: 2px;
    width: 100%;
  }
  .rule.short { width: 60%; }
  .rule.shorter { width: 40%; }
  .rule.thin { background: repeating-linear-gradient(90deg, #6a6a6a 0 6px, transparent 6px 12px); }

  /* page header */
  header.page {
    padding: 22px 28px 0 28px;
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 16px;
    flex-wrap: wrap;
  }
  header.page h1 {
    margin: 0;
    font-size: 44px;
    line-height: 1;
  }
  header.page .sub {
    color: var(--ink-soft);
    font-size: 16px;
    max-width: 520px;
  }

  /* tabs row */
  .tabs {
    display: flex;
    gap: 10px;
    padding: 14px 28px 0 28px;
    flex-wrap: wrap;
    align-items: center;
  }
  .tabs .label {
    font-family: "Caveat", cursive;
    font-size: 22px;
    color: var(--ink-soft);
    margin-right: 4px;
  }
  .tabs .ink-btn { font-family: "Caveat", cursive; font-size: 22px; padding: 4px 16px; }

  /* state switcher */
  .states {
    display: flex;
    gap: 8px;
    padding: 8px 28px 0 28px;
    flex-wrap: wrap;
    align-items: center;
  }
  .states .label { font-family: "Caveat", cursive; font-size: 20px; color: var(--ink-muted); }
  .states .ink-btn { font-size: 18px; padding: 3px 12px; font-family: "Caveat", cursive; }

  /* artboard frame */
  .artboard-wrap {
    padding: 18px 28px 80px 28px;
  }
  .artboard {
    background: #fff;
    border: 2.5px solid var(--rule);
    border-radius: 18px 22px 16px 24px / 20px 16px 22px 18px;
    box-shadow: 4px 5px 0 0 rgba(0,0,0,0.10);
    width: 100%;
    height: min(78vh, 760px);
    min-height: 520px;
    overflow: hidden;
    position: relative;
  }
  .artboard-caption {
    font-family: "Caveat", cursive;
    font-size: 22px;
    color: var(--ink-soft);
    padding: 0 4px 8px 4px;
    display: flex;
    justify-content: space-between;
    align-items: baseline;
  }
  .artboard-caption b { font-weight: 700; color: var(--ink); }

  /* annotation arrow (handwritten note pointing to UI) */
  .annot {
    position: absolute;
    font-family: "Caveat", cursive;
    color: var(--ink-soft);
    font-size: 20px;
    line-height: 1.05;
    pointer-events: none;
  }
  .annot .arrow {
    display: inline-block;
    transform: translateY(-2px);
    margin: 0 4px;
  }

  /* ============ shared chat primitives (low-fi) ============ */

  .logo-mark {
    width: 84px;
    height: 84px;
    border: 2.5px solid var(--rule);
    border-radius: 50% 48% 52% 50% / 48% 52% 48% 52%;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--teal-soft);
    font-family: "Caveat", cursive;
    font-weight: 700;
    font-size: 44px;
    color: var(--ink);
    transform: rotate(-3deg);
    box-shadow: 2px 3px 0 0 rgba(0,0,0,0.08);
  }
  .logo-mark.small { width: 38px; height: 38px; font-size: 22px; }

  .suggest-chip {
    border: 2px solid var(--rule);
    background: #fff;
    border-radius: 10px 14px 8px 16px / 12px 9px 14px 11px;
    padding: 10px 14px;
    font-family: "Kalam", sans-serif;
    font-size: 16px;
    color: var(--ink);
    cursor: pointer;
    box-shadow: 2px 2px 0 0 rgba(0,0,0,0.10);
    text-align: left;
  }
  .suggest-chip:hover { background: var(--teal-soft); }

  .bubble-user {
    background: var(--orange-soft);
    border: 2px solid var(--rule);
    border-radius: 14px 16px 4px 16px / 14px 16px 6px 14px;
    padding: 10px 14px;
    max-width: 70%;
    align-self: flex-end;
    font-size: 16px;
    box-shadow: 2px 2px 0 0 rgba(0,0,0,0.08);
  }
  .bubble-bot {
    background: var(--teal-soft);
    border: 2px solid var(--rule);
    border-radius: 16px 14px 16px 4px / 14px 16px 14px 6px;
    padding: 10px 14px;
    max-width: 72%;
    align-self: flex-start;
    font-size: 16px;
    box-shadow: 2px 2px 0 0 rgba(0,0,0,0.08);
  }

  .typing-dots {
    display: inline-flex; gap: 6px; align-items: center;
  }
  .typing-dots span {
    width: 9px; height: 9px; background: var(--ink); border-radius: 50%;
    animation: bob 1s infinite ease-in-out;
  }
  .typing-dots span:nth-child(2) { animation-delay: .15s; }
  .typing-dots span:nth-child(3) { animation-delay: .30s; }
  @keyframes bob {
    0%, 60%, 100% { transform: translateY(0); opacity: .4; }
    30% { transform: translateY(-5px); opacity: 1; }
  }

  .error-banner {
    border: 2px solid var(--red);
    background: #fff2f2;
    color: var(--red);
    border-radius: 8px 12px 6px 14px / 10px 8px 14px 9px;
    padding: 10px 14px;
    font-size: 15px;
    box-shadow: 2px 2px 0 0 rgba(215,38,61,0.18);
  }

  .input-row {
    display: flex;
    gap: 10px;
    align-items: center;
  }
  .input-fake {
    flex: 1;
    border: 2px solid var(--rule);
    border-radius: 10px 14px 8px 16px / 12px 9px 14px 11px;
    background: #fff;
    padding: 12px 14px;
    font-size: 16px;
    color: var(--ink-muted);
    box-shadow: inset 1px 2px 0 0 rgba(0,0,0,0.04);
    min-height: 44px;
    display: flex; align-items: center;
  }
  .send-btn {
    border: 2px solid var(--rule);
    background: var(--orange);
    color: var(--ink);
    border-radius: 10px 14px 8px 16px / 12px 9px 14px 11px;
    padding: 10px 18px;
    font-family: "Caveat", cursive;
    font-weight: 700;
    font-size: 22px;
    cursor: pointer;
    box-shadow: 2px 2px 0 0 rgba(0,0,0,0.18);
  }

  .lo-fi-hint {
    font-family: "Caveat", cursive;
    font-size: 18px;
    color: var(--ink-muted);
  }

  /* zigzag underline accent */
  .zig {
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 80 8'><path d='M0 6 Q10 0 20 4 T40 4 T60 4 T80 4' stroke='%23ff9f1c' stroke-width='2' fill='none'/></svg>");
    background-repeat: repeat-x;
    background-position: 0 100%;
    background-size: 80px 8px;
    padding-bottom: 6px;
  }

  /* description card under each wireframe */
  .why {
    margin-top: 14px;
    padding: 14px 18px;
    background: #fffdf4;
    border: 2px dashed var(--rule);
    border-radius: 12px 16px 10px 18px / 14px 11px 16px 13px;
    font-size: 15px;
    color: var(--ink-soft);
    line-height: 1.5;
  }
  .why b { color: var(--ink); font-family: "Caveat", cursive; font-size: 20px; font-weight: 700; }
</style>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
<div id="root"></div>

<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel" src="wireframes.jsx"></script>
<script type="text/babel" src="app.jsx"></script>
</body>
</html>
